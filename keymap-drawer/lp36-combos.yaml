layers:
  HORIZONTAL:
    - [Q, W, E, R, T, Y, U, I, O, P]
    - [A, S, D, F, G, H, J, K, L, "'"]
    - [Z, X, C, V, B, N, M, ",", ".", "?"]
    - [Esc, Tab, Space, Bksp, Enter, Del]
  VERTICAL:
    - [Q, W, E, R, T, Y, U, I, O, P]
    - [A, S, D, F, G, H, J, K, L, "'"]
    - [Z, X, C, V, B, N, M, ",", ".", "?"]
    - [Esc, Tab, Space, Bksp, Enter, Del]

combos:
  - {p: [1, 2], k: Esc, l: [HORIZONTAL], a: top}
  - {p: [11, 12], k: "Tab\n⇧Alt", l: [HORIZONTAL], a: top}
  - {p: [21, 23], k: Cut, l: [HORIZONTAL], a: bottom, o: -0.7}
  - {p: [21, 22], k: Copy, l: [HORIZONTAL], a: bottom, o: 0.0}
  - {p: [22, 23], k: Paste, l: [HORIZONTAL], a: bottom, o: 0.7}
  - {p: [6, 7], k: Bksp, l: [HORIZONTAL], a: top}
  - {p: [7, 8], k: Del, l: [HORIZONTAL], a: top}
  - {p: [16, 17], k: "(\n<", l: [HORIZONTAL], a: top}
  - {p: [17, 18], k: ")\n>", l: [HORIZONTAL], a: top}
  - {p: [26, 27], k: "[\n{", l: [HORIZONTAL], a: bottom}
  - {p: [27, 28], k: "]\n}", l: [HORIZONTAL], a: bottom}

  - {p: [1, 11], k: "@", l: [VERTICAL], a: left}
  - {p: [2, 12], k: "#", l: [VERTICAL], a: left}
  - {p: [3, 13], k: "$", l: [VERTICAL], a: left}
  - {p: [4, 14], k: "%", l: [VERTICAL], a: left}
  - {p: [11, 21], k: "`", l: [VERTICAL], a: left}
  - {p: [12, 22], k: "\\", l: [VERTICAL], a: left}
  - {p: [13, 23], k: "/", l: [VERTICAL], a: left}
  - {p: [14, 24], k: "~", l: [VERTICAL], a: left}
  - {p: [5, 15], k: "^", l: [VERTICAL], a: right}
  - {p: [6, 16], k: "+", l: [VERTICAL], a: right}
  - {p: [7, 17], k: "*", l: [VERTICAL], a: right}
  - {p: [8, 18], k: "&", l: [VERTICAL], a: right}
  - {p: [15, 25], k: "_", l: [VERTICAL], a: right}
  - {p: [16, 26], k: "-", l: [VERTICAL], a: right}
  - {p: [17, 27], k: "=", l: [VERTICAL], a: right}
  - {p: [18, 28], k: "|", l: [VERTICAL], a: right}
