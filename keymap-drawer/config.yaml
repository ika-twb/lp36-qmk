draw_config:
  dark_mode: false
  key_w: 66
  key_h: 62
  key_rx: 6
  key_ry: 6
  combo_w: 46
  combo_h: 32
  inner_pad_w: 2
  inner_pad_h: 2
  outer_pad_w: 24
  outer_pad_h: 42
  line_spacing: 1.15
  append_colon_to_layer_header: true
  svg_style: |
    svg {
      font-family: ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace;
      font-size: 11.5px;
      text-rendering: optimizeLegibility;
    }
    rect { fill: #f6f8fa; stroke: #afb8c1; stroke-width: 1; }
    rect.held { fill: #ffebe9; }
    rect.combo { fill: #ddf4ff; }
    text { text-anchor: middle; dominant-baseline: middle; }
    text.label { font-size: 14px; font-weight: 700; text-anchor: start; }
    text.hold, text.shifted { font-size: 8px; }
    text.hold { transform: translateY(-5px); }
    text.shifted { transform: translateY(5px); }
    text.combo { font-size: 9px; }
    path { stroke: #57606a; stroke-width: 1; fill: none; }

parse_config:
  raw_binding_map:
    HM_A: {t: A, h: Win}
    HM_S: {t: S, h: Alt}
    HM_D: {t: D, h: Ctrl}
    HM_F: {t: F, h: Shift}
    HM_J: {t: J, h: Shift}
    HM_K: {t: K, h: Ctrl}
    HM_L: {t: L, h: Alt}
    HM_QUOT: {t: "'", h: Win}
    TH_ESC: {t: Esc, h: MEDIA}
    TH_TAB: {t: Tab, h: NAV}
    TH_SPC: {t: Space, h: MOUSE}
    TH_BSPC: {t: Bksp, h: SYM}
    TH_ENT: {t: Enter, h: NUM}
    TH_DEL: {t: Del, h: FUNC}
    CM_MORPH: {t: ",", s: ";"}
    DT_MORPH: {t: ".", s: ":"}
    QEXCL: {t: "?", s: "!"}
    MM_LEFT: Mouse Left
    MM_DOWN: Mouse Down
    MM_UP: Mouse Up
    MM_RIGHT: Mouse Right
    MS_WHLL: Wheel Left
    MS_WHLD: Wheel Down
    MS_WHLU: Wheel Up
    MS_WHLR: Wheel Right
    MS_BTN1: Button 1
    MS_BTN2: Button 2
    MS_BTN3: Button 3
    QK_BOOT: BOOT
    KC_AGAIN: Redo
    KC_PASTE: Paste
    KC_COPY: Copy
    KC_CUT: Cut
    KC_UNDO: Undo
    LCTL(KC_UP): Paragraph Up
    LCTL(KC_RGHT): Word Forward
    LCTL(KC_LEFT): Word Backward
    LCTL(KC_DOWN): Paragraph Down
    S(KC_LBRC): "{"
    S(KC_RBRC): "}"
    S(KC_7): "&"
    S(KC_8): "*"
    S(KC_9): "("
    S(KC_SCLN): ":"
    S(KC_4): "$"
    S(KC_5): "%"
    S(KC_6): "^"
    S(KC_EQL): "+"
    S(KC_GRV): "~"
    S(KC_1): "!"
    S(KC_2): "@"
    S(KC_3): "#"
    S(KC_BSLS): "|"
    S(KC_0): ")"
    S(KC_MINS): "_"
