name: Build firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest

    steps:
      - name: Mark workspace as safe
        run: git config --global --add safe.directory '*'

      - name: Check out userspace
        uses: actions/checkout@v4
        with:
          path: userspace

      - name: Check out pinned Vial-QMK
        uses: actions/checkout@v4
        with:
          repository: vial-kb/vial-qmk
          ref: dd43959ae5c08d8a28d38a1acf7b04e86b14a344
          submodules: recursive
          path: qmk_firmware

      - name: Install LP36 overlay
        run: |
          cp -R userspace/keyboards/lp36 qmk_firmware/keyboards/lp36
          cp -R userspace/tests/lp36_behavior qmk_firmware/tests/lp36_behavior

      - name: Verify main diagram source matches QMK
        run: |
          python -m pip install keymap-drawer==0.22.0
          userspace/scripts/sync-keymap.sh qmk_firmware
          git -C userspace diff --exit-code -- keymap-drawer/lp36.yaml

      - name: Test LP36 HID behavior
        working-directory: qmk_firmware
        run: qmk test-c --test lp36_behavior --clean --parallel 2

      - name: Lint keyboard definition
        working-directory: qmk_firmware
        run: qmk lint -kb lp36

      - name: Compile LP36 firmware
        working-directory: qmk_firmware
        run: qmk compile -kb lp36 -km default

      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: lp36-firmware-${{ github.sha }}
          path: qmk_firmware/lp36_default.uf2
          if-no-files-found: error
