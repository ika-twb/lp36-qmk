name: Render keymap

on:
  push:
    branches: [main]
    paths:
      - "keyboards/lp36/keymaps/**"
      - "keymap-drawer/**"
      - "scripts/render-keymap.sh"
      - "scripts/sync-keymap.sh"
      - ".github/workflows/keymap.yml"
  pull_request:
    paths:
      - "keyboards/lp36/keymaps/**"
      - "keymap-drawer/**"
      - "scripts/render-keymap.sh"
      - "scripts/sync-keymap.sh"
      - ".github/workflows/keymap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install keymap-drawer
        run: python -m pip install keymap-drawer==0.22.0

      - name: Render SVGs
        run: ./scripts/render-keymap.sh

      - name: Require committed images to be current
        run: |
          git diff --exit-code -- keymap-drawer/lp36.svg keymap-drawer/lp36-combos.svg
          test -s keymap-drawer/lp36-combos.png

      - name: Upload rendered keymaps
        uses: actions/upload-artifact@v4
        with:
          name: lp36-keymap-${{ github.sha }}
          path: |
            keymap-drawer/*.svg
            keymap-drawer/*.png
          if-no-files-found: error
